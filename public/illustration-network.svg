<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#020617"/>
  <!-- Network nodes and connections -->
  <g opacity="0.3">
    <line x1="100" y1="100" x2="250" y2="150" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="250" y1="150" x2="400" y2="120" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="400" y1="120" x2="550" y2="180" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="550" y1="180" x2="700" y2="140" stroke="#0ea5e9" stroke-width="1"/>
    <line x1="100" y1="250" x2="300" y2="280" stroke="#06b6d4" stroke-width="1"/>
    <line x1="300" y1="280" x2="500" y2="260" stroke="#06b6d4" stroke-width="1"/>
    <line x1="500" y1="260" x2="700" y2="300" stroke="#06b6d4" stroke-width="1"/>
  </g>
  <!-- Nodes -->
  <circle cx="100" cy="100" r="6" fill="#0ea5e9"/>
  <circle cx="250" cy="150" r="6" fill="#0ea5e9"/>
  <circle cx="400" cy="120" r="6" fill="#0ea5e9"/>
  <circle cx="550" cy="180" r="6" fill="#0ea5e9"/>
  <circle cx="700" cy="140" r="6" fill="#0ea5e9"/>
  <circle cx="100" cy="250" r="6" fill="#06b6d4"/>
  <circle cx="300" cy="280" r="6" fill="#06b6d4"/>
  <circle cx="500" cy="260" r="6" fill="#06b6d4"/>
  <circle cx="700" cy="300" r="6" fill="#06b6d4"/>
  <!-- Glow effect -->
  <g opacity="0.4">
    <circle cx="400" cy="200" r="80" fill="url(#radial1)"/>
  </g>
  <defs>
    <radialGradient id="radial1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>